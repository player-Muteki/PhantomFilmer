min_battery_takeoff: 30
low_battery_land: 20
max_height_cm: 150
min_height_cm: 60
max_rc_speed: 35
target_lost_hover_seconds: 3
target_lost_land_seconds: 8
camera_width: 640
camera_height: 480
target_color: red
vision:
  detector_type: aruco
  # ArUco 面积与红色轮廓面积不同；真机前请先用 follow-dry-run 标定面积阈值。
  aruco_dictionary: DICT_4X4_50
  target_marker_id: 23
  smoothing_alpha: 0.30
  temporary_lost_frames: 0
  min_marker_area: 300
  # 人物 ReID 模式：改为 person_reid 后才会加载以下模型。
  # 多张参考图用英文逗号分隔，路径相对于项目根目录。
  reference_images: "data/reid_target/front.jpg,data/reid_target/side.jpg"
  person_detector_model: "weights/yolov8n.pt"
  person_detection_confidence: 0.45
  reid_model_name: "osnet_x0_25"
  reid_model_path: "weights/osnet_x0_25_msmt17.pth"
  reid_device: "cpu"
  reid_similarity_threshold: 0.65
  reid_ambiguity_margin: 0.05
  # 真机初测保持为 0：未确认身份时立即视为丢失并悬停。
  reid_temporary_lost_frames: 0
display_console_camera: true
console_window_name: "PhantomFilmer Console Follow"
task_stop_timeout_seconds: 10
fake_camera_enabled: true
fake_target_speed: 3
fake_target_lost_interval_seconds: 12
fake_target_lost_duration_seconds: 2
frame_failure_limit: 30
horizontal_dead_zone_ratio: 0.08
yaw_kp: 160
minimum_yaw_speed: 20
maximum_yaw_speed: 35
# ArUco 前后距离分区：0.030–0.080 悬停，区外全速调整。
target_area_ratio_min: 0.030
target_area_ratio_max: 0.080
forward_kp: 1300
minimum_forward_speed: 12
maximum_forward_speed: 35
forward_speed_while_aligning: 16
large_horizontal_error_ratio: 0.28
forward_speed_while_turning_ratio: 0.25
vertical_dead_zone_ratio: 0.10
vertical_speed: 20
target_lock_stable_frames: 15
target_lock_exit_area_ratio_min: 0.030
target_lock_exit_area_ratio_max: 0.080
target_lock_exit_horizontal_dead_zone_ratio: 0.12
target_lock_exit_vertical_dead_zone_ratio: 0.15
control_interval: 0.05
detector_min_area_ratio: 0.002
detector_min_area: 500
obstacle:
  enabled: false
  risk_zone_width_ratio: 0.55
  risk_zone_height_ratio: 0.65
  risk_zone_vertical_offset_ratio: 0.05
  minimum_obstacle_area: 1500
  caution_area_ratio: 0.08
  blocked_area_ratio: 0.18
  avoidance_yaw_speed: 18
  avoidance_lateral_speed: 0
  max_avoidance_seconds: 5.0
  recovery_clear_frames: 10
  forward_speed_in_caution_ratio: 0.35
lost_target_hover_seconds: 3
lost_target_land_seconds: 8
llm_enabled: true
llm_base_url: "https://api.deepseek.com/chat/completions"
llm_model: "deepseek-chat"
llm_timeout_seconds: 8

swarm:
  enabled: false
  command_interval_ms: 200
  takeoff_interval_s: 1.0
  require_formation_feedback: true
  formation_feedback_timeout_s: 0.5
  hover_test_seconds: 10
  rc_test_seconds: 0.5
  rc_test_left_right: 0
  rc_test_forward_backward: 8
  rc_test_up_down: 0
  rc_test_yaw: 0
  max_lr_speed: 10
  max_fb_speed: 10
  max_ud_speed: 10
  max_yaw_speed: 10
  minimum_takeoff_battery: 30
  leader_id: drone_1
  video_drone_id: drone_1
  drones:
    - id: drone_1
      ip: 192.168.1.101
      role: leader
    - id: drone_2
      ip: 192.168.1.102
      role: follower
    - id: drone_3
      ip: 192.168.1.103
      role: follower
    - id: drone_4
      ip: 192.168.1.104
      role: follower
