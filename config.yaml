min_battery_takeoff: 30
low_battery_land: 20
# 飞行高度超过 max_height_cm 会触发自动降落；低高度不触发自动迫降。
# min_height_cm 仍用于基础悬停高度配置和搜索高度下限。
max_height_cm: 220
min_height_cm: 60
# 起飞后先到达 1.5 m 基础悬停高度，再进入自动跟随。
base_hover_height_cm: 150
base_hover_height_tolerance_cm: 5
base_hover_vertical_speed: 20
base_hover_stable_readings: 3
# 起飞高度使用多次遥测确认，避免刚起飞时偶发的 0 cm 读数导致误判。
takeoff_height_verify_timeout_seconds: 5
takeoff_height_min_cm: 20
takeoff_height_stable_readings: 3
takeoff_height_sample_interval_seconds: 0.2
# 底部 TOF 离地高度使用最近 5 次读数的中位数；连续失效则降落。
height_filter_window: 5
height_max_valid_cm: 500
height_failure_limit: 10
max_rc_speed: 35
camera_width: 640
camera_height: 480
vision:
  detector_type: aruco
  # ArUco 面积与红色轮廓面积不同；真机前请先用 follow-dry-run 标定面积阈值。
  aruco_dictionary: DICT_4X4_50
  target_marker_id: 23
  smoothing_alpha: 0.30
  temporary_lost_frames: 0
  min_marker_area: 300
  # 人物 ReID 模式：改为 person_reid 后才会加载以下模型。
  # 多张参考图用英文逗号分隔，路径相对于项目根目录。
  reference_images: "data/reid_target/front.jpg,data/reid_target/side.jpg"
  person_detector_model: "weights/yolov8n.pt"
  person_detection_confidence: 0.45
  reid_model_name: "osnet_x0_25"
  reid_model_path: "weights/osnet_x0_25_msmt17.pth"
  reid_device: "cpu"
  reid_similarity_threshold: 0.65
  reid_ambiguity_margin: 0.05
  # 真机初测保持为 0：未确认身份时立即视为丢失并悬停。
  reid_temporary_lost_frames: 0
# 旧版地面锁定流程的兼容参数；当前 reid-demo 直接由命令行 y 授权起飞，不使用。
reid_lock_stable_frames: 10
reid_lock_timeout_seconds: 30
reid_confirmation_timeout_seconds: 30
display_console_camera: true
console_window_name: "PhantomFilmer Console Follow"
task_stop_timeout_seconds: 10
fake_target_speed: 3
fake_target_lost_interval_seconds: 12
fake_target_lost_duration_seconds: 2
frame_failure_limit: 30
horizontal_dead_zone_ratio: 0.08
yaw_kp: 160
minimum_yaw_speed: 20
maximum_yaw_speed: 35
# ArUco 前后距离分区：0.030–0.080 悬停，区外全速调整。
target_area_ratio_min: 0.030
target_area_ratio_max: 0.080
# ReID 人物距离带：人物框占画面 0.22–0.31 时保持前后距离。
# 相比原 0.25–0.35，在约 1.5 m 标定距离附近约后移 10 cm；单目面积法只能
# 给出近似距离，真机场地、人物身高和服装变化后仍需复测。
# 仅 reid-demo 运行期覆盖到 shared 配置，不影响默认 ArUco 跟随。
reid_target_area_ratio_min: 0.22
reid_target_area_ratio_max: 0.31
maximum_forward_speed: 25
forward_speed_while_aligning: 16
vertical_dead_zone_ratio: 0.10
vertical_speed: 20
target_lock_stable_frames: 15
# 锁定退出面积带比进入带（0.030–0.080）更宽：0.025–0.085 形成面积滞回，
# 避免面积在中带边界附近波动时反复锁定/解锁。
target_lock_exit_area_ratio_min: 0.025
target_lock_exit_area_ratio_max: 0.085
# ReID 锁定退出面积带比进入带（0.22–0.31）略宽：0.20–0.33 形成面积滞回。
reid_target_lock_exit_area_ratio_min: 0.20
reid_target_lock_exit_area_ratio_max: 0.33
target_lock_exit_horizontal_dead_zone_ratio: 0.12
target_lock_exit_vertical_dead_zone_ratio: 0.15
control_interval: 0.05
# 控制率低于该值（Hz）时控制台会周期性告警，提示检测或显示处理过慢。
min_control_hz: 8
detector_min_area_ratio: 0.002
detector_min_area: 500
obstacle:
  enabled: false
  risk_zone_width_ratio: 0.55
  risk_zone_height_ratio: 0.65
  risk_zone_vertical_offset_ratio: 0.05
  minimum_obstacle_area: 1500
  caution_area_ratio: 0.08
  blocked_area_ratio: 0.18
  avoidance_yaw_speed: 18
  avoidance_lateral_speed: 12
  max_avoidance_seconds: 5.0
  recovery_clear_frames: 10
  # CLEAR 直行最高 25；CAUTION 保留跟随，但正向前进最高限制为 20。
  maximum_forward_speed_in_caution: 20
  temporal_window_frames: 5
  detect_confirm_frames: 3
  clear_confirm_frames: 5
  sector_count: 5
  scan_yaw_speed: 8
  min_free_space_score: 0.22
  timeout_action: land
  log_enabled: true
  log_dir: logs/avoidance
  log_every_n_frames: 2
  # 每 N 帧重新跑一次避障检测（配合风险区裁剪，减少 CV 开销），中间帧复用上次观测。
  detect_every_n_frames: 2
# 遮挡恢复不是“看见障碍就绕”：必须先稳定锁定目标，再确认障碍与目标预测框
# 连续重合。主动动作只做低速横移脉冲，脉冲间悬停并重新运行 ReID。
occlusion_recovery:
  enabled: true
  initial_lock_frames: 10
  # 第一次稳定锁定前只沿固定方向旋转一周，不允许横移、前后或升降搜索。
  initial_scan_yaw_speed: 20
  initial_scan_degrees: 360
  # yaw 遥测不可用时按 18 秒估算一周；35 秒为总安全上限。
  initial_scan_fallback_seconds: 18.0
  initial_acquire_timeout_seconds: 35.0
  # 目标刚消失时先悬停观察，避免一帧漏检触发动作。
  occlusion_check_seconds: 1.5
  occlusion_max_age_seconds: 2.5
  # 现场泡沫板多被全局检测器判为 CAUTION；只有面积至少 2% 且与预测目标框
  # 连续重合时才作为遮挡证据，不会把任意小轮廓升级成主动横移。
  occluder_min_area_ratio: 0.02
  occlusion_overlap_ratio: 0.25
  occluder_iou_threshold: 0.15
  occlusion_confirm_frames: 3
  # 目标丢失先判断是否沿画面左右边缘离开：边缘位置、持续向外漂移、
  # 无人机偏航已接近上限但误差仍增大，都作为出画证据。确认出画直接搜索；
  # 只是可疑时最多悬停 0.8 秒也强制搜索，禁止把人背后背景当成遮挡横移。
  unknown_loss_hover_seconds: 0.8
  exit_edge_margin_ratio: 0.15
  exit_history_frames: 8
  exit_min_displacement_ratio: 0.02
  exit_min_velocity_ratio_per_second: 0.15
  exit_time_to_edge_seconds: 1.2
  exit_yaw_saturation_ratio: 0.85
  # 已确认遮挡但左右均不安全时悬停等待，禁止退回 360° 搜索；超时后降落。
  no_safe_route_seconds: 3.0
  prediction_margin_ratio: 0.20
  # Tello 横移 RC 取 25 并保持约 4 秒，名义单次位移约 1 m；不叠加前进、
  # 升降或偏航。RC 速度不是测距闭环，实际距离须在比赛场地重新标定。
  lateral_speed: 25
  lateral_pulse_seconds: 4.0
  settle_seconds: 0.55
  # 1 m 已是大动作：每次遮挡事件最多只允许一次，防止累计到数米。
  max_lateral_pulses: 1
  # 每次横移和悬停仍未看见人时，朝横移反方向偏航 30°，短暂停留运行
  # ReID，再回到原航向；不得与横移同时输出。
  local_scan_degrees: 30
  local_scan_yaw_speed: 20
  local_scan_hold_seconds: 0.35
  local_scan_fallback_seconds: 1.5
  local_scan_return_tolerance_degrees: 3.0
  reacquire_frames: 5
  min_free_space_score: 0.35
lost_target_hover_seconds: 3
lost_target_land_seconds: 8
# ReID 丢失目标后的有限搜索。先悬停判断；疑似距离过近时最多做两次短后退，
# 其他情况只用原地偏航和 TOF 限高内的分层升降搜索。
target_search:
  enabled: true
  hold_seconds: 1.0
  reacquire_frames: 5
  # 丢失后先按最后方向寻找：水平偏航 ±25、上下 ±20。
  last_direction_yaw_speed: 25
  # 后续各高度层偏航扫描速度和所有上下移动速度均为 ±20。
  yaw_speed: 20
  vertical_speed: 20
  last_direction_seconds: 2.0
  full_rotation_degrees: 360
  # 航向遥测不可用时的保底时间；偏航指令 20 时约用 18 秒完成一圈。
  full_rotation_fallback_seconds: 18.0
  height_step_cm: 20
  min_height_cm: 80
  max_height_cm: 200
  close_recovery_enabled: true
  close_area_ratio: 0.35
  close_very_area_ratio: 0.40
  close_backward_speed: 35
  close_pulse_seconds: 1.5
  close_pause_seconds: 0.50
  close_max_attempts: 2
  edge_margin_ratio: 0.03
llm_enabled: true
llm_base_url: "https://api.deepseek.com/chat/completions"
llm_model: "deepseek-chat"
llm_timeout_seconds: 8
