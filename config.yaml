min_battery_takeoff: 20
low_battery_land: 5
# 高度保护只在超过 max_height_cm 时触发自动降落；低离地高度不再迫降。
# min_height_cm 仅用于搜索/爬升目标范围，不作为飞行中迫降阈值。
max_height_cm: 220
min_height_cm: 60
# 起飞后先到达 1.5 m 基础悬停高度，再进入自动跟随。
base_hover_height_cm: 150
base_hover_height_tolerance_cm: 5
base_hover_vertical_speed: 20
base_hover_stable_readings: 3
# 跳过起飞后的离地高度确认，起飞稳定后直接进入基础悬停高度控制。
takeoff_height_verify_enabled: false
# 以下参数仅在重新开启离地高度确认时生效。
takeoff_height_verify_timeout_seconds: 5
takeoff_height_min_cm: 20
takeoff_height_stable_readings: 3
takeoff_height_sample_interval_seconds: 0.2
# 底部 TOF 离地高度使用最近 5 次读数的中位数；连续失效则降落。
height_filter_window: 5
height_max_valid_cm: 500
height_failure_limit: 10
max_rc_speed: 35
camera_width: 640
camera_height: 480
vision:
  # 多张参考图用英文逗号分隔，路径相对于项目根目录。
  reference_images: "data/reid_target/front.jpg,data/reid_target/side.jpg"
  # 实时免起飞测试使用已注册并与 yolov8n 权重匹配的人物档案。
  reference_profile: "person-a-current-outfit"
  person_detector_model: "weights/yolov8n.pt"
  person_detection_confidence: 0.45
  reid_model_name: "osnet_x0_25"
  reid_model_path: "weights/osnet_x0_25_msmt17.pth"
  reid_device: "cpu"
  reid_similarity_threshold: 0.65
  reid_ambiguity_margin: 0.05
  # 真机初测保持为 0：未确认身份时立即视为丢失并悬停。
  reid_temporary_lost_frames: 0
  # JointBDOE 输出人体相对摄像机的朝向角；普通自动模式仅显示，s 侧向模式用于飞控。
  # 先用 tools/jointbdoe_angle_eval.py 验证现场角度和 CPU 帧率后再进行真机侧向测试。
  jointbdoe_enabled: true
  jointbdoe_source_path: "third_party/JointBDOE"
  jointbdoe_model_path: "weights/jointbdoe_s.pt"
  jointbdoe_device: "cpu"
  jointbdoe_image_size: 640
  jointbdoe_confidence_threshold: 0.30
  jointbdoe_iou_threshold: 0.45
  jointbdoe_match_iou_threshold: 0.20
  jointbdoe_smoothing_window: 5
  # 视觉物体框只用于屏幕提示，不参与飞控避障；先关闭并完成 CPU 性能测试。
  visual_object_detection_enabled: false
  visual_object_confidence: 0.35
  visual_object_classes: "bicycle,car,motorcycle,bus,truck,bench,chair,couch,suitcase,backpack"
# 旧版地面锁定流程的兼容参数；当前 reid-demo 直接由命令行 y 授权起飞，不使用。
reid_lock_stable_frames: 10
reid_lock_timeout_seconds: 30
reid_confirmation_timeout_seconds: 30
display_console_camera: true
console_window_name: "PhantomFilmer Console Follow"
task_stop_timeout_seconds: 10
fake_target_speed: 3
fake_target_lost_interval_seconds: 12
fake_target_lost_duration_seconds: 2
frame_failure_limit: 30
horizontal_dead_zone_ratio: 0.08
yaw_kp: 160
minimum_yaw_speed: 15
maximum_yaw_speed: 25
# ReID 人物框占画面 0.22–0.32 时保持前后距离。
target_area_ratio_min: 0.22
target_area_ratio_max: 0.32
maximum_forward_speed: 25
forward_speed_while_aligning: 16
vertical_dead_zone_ratio: 0.10
vertical_speed: 20
target_lock_stable_frames: 15
# 锁定退出面积带略宽于进入带，形成面积滞回。
target_lock_exit_area_ratio_min: 0.20
target_lock_exit_area_ratio_max: 0.34
target_lock_exit_horizontal_dead_zone_ratio: 0.12
target_lock_exit_vertical_dead_zone_ratio: 0.15
# 侧向跟随由 s 键进入；只使用 ReID + JointBDOE，不进入自动避障仲裁。
side_follow:
  enabled: true
  # 连续角度足够稳定后，只选择一次离当前角度更近的 90° 或 270°。
  orientation_stable_frames: 5
  orientation_max_deviation_deg: 18
  minimum_detection_confidence: 0.30
  minimum_match_iou: 0.20
  angle_tolerance_deg: 12
  angle_exit_tolerance_deg: 20
  # 连续多帧朝向偏离才判断为人物转身，避免角度抖动触发绕行。
  orbit_entry_frames: 3
  lock_stable_frames: 6
  # 跑道跟随：人物偏到画面左右时，飞机同方向横移，日常不偏航。
  tracking_lateral_kp: 55
  minimum_tracking_lateral_speed: 8
  maximum_tracking_lateral_speed: 20
  tracking_lateral_direction_sign: 1
  # 人物转身后的绕人修正：实测顺时针增大角度，逆时针减小角度。
  # 摄像头朝向人物时，顺时针绕行对应飞机向左横移。
  clockwise_lateral_direction: left
  lateral_kp: 0.22
  minimum_lateral_speed: 8
  maximum_lateral_speed: 20
  # 正面/背面与两侧等距时固定选择 90°，避免随机切边。
  tie_break_target_angle: 90
  max_orbit_seconds: 20
control_interval: 0.05
# 控制率低于该值（Hz）时控制台会周期性告警，提示检测或显示处理过慢。
min_control_hz: 8
manual_control:
  enabled: true
  # 到达150 cm后持续悬停，必须在摄像头窗口按 m（手动）或 a（自动）。
  forward_speed: 20
  lateral_speed: 20
  vertical_speed: 15
  yaw_speed: 20
  # OpenCV没有可靠的按键松开事件；方向指令超过该时间未刷新便自动悬停。
  command_timeout_seconds: 0.25
  # 防止一次长按m的系统重复事件在刚进入手动后又立刻退出。
  mode_switch_debounce_seconds: 0.75
  # 手动切回自动后，连续识别达到该帧数才允许自动运动。
  reacquire_frames: 5
  # 手动模式只阻止危险前进，不会触发自动横移绕障。
  front_tof_guard_enabled: true
  front_stop_distance_cm: 60
  block_forward_when_tof_invalid: true
  minimum_descent_height_cm: 40
  maximum_ascent_height_cm: 200
obstacle:
  enabled: false
  # RoboMaster TT 顶部扩展红外 ToF：有效距离 <= 60 cm 时进入 BLOCKED。
  front_tof_enabled: true
  front_tof_blocked_distance_cm: 60
  # BLOCKED 避障：固定向右约1m，再以-12左转90度；全程绝不前进。
  front_tof_clear_distance_cm: 70
  front_tof_poll_interval_seconds: 0.2
  front_tof_max_age_seconds: 0.8
  # 连续3帧目标框均未触碰左右边缘却突然丢失：向前25，直到ToF发现1.2m内任意实体。
  center_loss_forward_enabled: true
  center_loss_forward_speed: 25
  center_loss_history_frames: 3
  center_loss_edge_margin_ratio: 0.05
  avoidance_lateral_speed: 20
  bypass_lateral_direction: right
  # Tello无横向里程计：用速度20持续约5秒估算右移100cm。
  bypass_lateral_distance_cm: 100
  # 固定右移阶段的安全时间上限。
  bypass_max_sidestep_seconds: 10
  # 目标曾被识别后突然丢失：悬停收集5个新鲜ToF样本；量程内才启动右移观察。
  lost_tof_sample_count: 5
  # 目标丢失调查期间ToF连续异常：先悬停，第5次请求安全降落。
  lost_tof_failure_limit: 5
  # 普通避障和目标丢失遮挡路线固定右移约1m后，都以-12左转90度寻找目标。
  post_bypass_turn_degrees: 90
  post_bypass_turn_speed: 12
  post_bypass_turn_timeout_seconds: 15
  recovery_clear_frames: 10
  detect_confirm_frames: 3
  clear_confirm_frames: 5
  timeout_action: land
  log_enabled: true
  log_dir: logs/avoidance
  log_every_n_frames: 2
  # 距离融合不分析视频像素，每帧只读取后台缓存的最新 ToF 样本。
  detect_every_n_frames: 1
lost_target_hover_seconds: 3
lost_target_land_seconds: 8
# ReID 丢失目标后的有限搜索。先悬停判断；疑似距离过近时最多做两次短后退，
# 其他情况只用原地偏航和 TOF 限高内的分层升降搜索。
target_search:
  enabled: true
  hold_seconds: 1.0
  reacquire_frames: 5
  # 丢失后先按最后方向寻找：水平偏航 ±25、上下 ±20。
  last_direction_yaw_speed: 25
  # 后续各高度层完整360度偏航扫描速度为 ±30；上下移动仍为 ±20。
  yaw_speed: 30
  vertical_speed: 20
  last_direction_seconds: 2.0
  full_rotation_degrees: 360
  # 航向遥测不可用时的保底时间；偏航指令30时约用12秒完成一圈。
  full_rotation_fallback_seconds: 12.0
  height_step_cm: 20
  min_height_cm: 80
  max_height_cm: 200
  close_recovery_enabled: true
  close_area_ratio: 0.32
  close_very_area_ratio: 0.37
  close_backward_speed: 35
  close_pulse_seconds: 1.5
  close_pause_seconds: 0.50
  close_max_attempts: 2
  edge_margin_ratio: 0.03
llm_enabled: true
llm_base_url: "https://api.deepseek.com/chat/completions"
llm_model: "deepseek-chat"
llm_timeout_seconds: 8
