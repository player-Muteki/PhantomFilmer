<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif">
  <title>PhantomFilmer 架构图 · 内核精简 / SDK 优先</title>

  <rect x="0" y="0" width="1600" height="840" fill="#c8eef9"/>

  <!-- 标题 -->
  <text x="40" y="50" font-size="40" font-weight="700" fill="#111827">PhantomFilmer 架构设计</text>
  <text x="40" y="82" font-size="20" fill="#6b7280">内核精简 · SDK 优先 ｜ 可插拔能力插件 + 单一决策内核</text>

  <!-- 第 1 层：应用层 -->
  <rect x="40" y="100" width="1520" height="96" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
  <rect x="40" y="100" width="6" height="96" rx="3" fill="#8b5cf6"/>
  <text x="66" y="160" font-size="20" font-weight="700" fill="#6d28d9">应用层</text>
  <text x="150" y="160" font-size="24" fill="#1f2937">CLI 运行模式 · 自然语言控制台</text>

  <!-- 第 2 层：内核层 -->
  <rect x="40" y="218" width="1520" height="186" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <rect x="40" y="218" width="6" height="186" rx="3" fill="#4f46e5"/>
  <text x="66" y="252" font-size="20" font-weight="700" fill="#4338ca">内核层 KERNEL</text>

  <rect x="64" y="266" width="724" height="122" rx="10" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="82" y="300" font-size="22" font-weight="700" fill="#3730a3">KernelSession</text>
  <text x="82" y="328" font-size="18" fill="#4b5563">9 阶段生命周期 FSM</text>
  <text x="82" y="354" font-size="18" fill="#4b5563">唯一 RC 发射缝 · fail-safe</text>

  <rect x="812" y="266" width="724" height="122" rx="10" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="830" y="300" font-size="22" font-weight="700" fill="#3730a3">ArbitrationEngine</text>
  <text x="830" y="328" font-size="18" fill="#4b5563">配方表 1–6 · 单一决策点</text>
  <text x="830" y="354" font-size="18" fill="#4b5563">每 tick 只选一个 owner</text>

  <!-- 第 3 层：Feature SDK -->
  <rect x="40" y="426" width="1520" height="170" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <rect x="40" y="426" width="6" height="170" rx="3" fill="#10b981"/>
  <text x="66" y="460" font-size="20" font-weight="700" fill="#047857">Feature SDK 层 · 能力插件</text>

  <rect x="64" y="476" width="278" height="104" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="82" y="512" font-size="22" font-weight="700" fill="#047857">follow</text>
  <text x="82" y="540" font-size="18" fill="#1f2937">跟随</text>

  <rect x="362" y="476" width="278" height="104" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="380" y="512" font-size="22" font-weight="700" fill="#047857">obstacle</text>
  <text x="380" y="540" font-size="18" fill="#1f2937">避障</text>

  <rect x="660" y="476" width="278" height="104" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="678" y="512" font-size="22" font-weight="700" fill="#047857">search</text>
  <text x="678" y="540" font-size="18" fill="#1f2937">搜索</text>

  <rect x="958" y="476" width="278" height="104" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="976" y="512" font-size="22" font-weight="700" fill="#047857">safety</text>
  <text x="976" y="540" font-size="18" fill="#1f2937">安全</text>

  <rect x="1256" y="476" width="278" height="104" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="1274" y="512" font-size="22" font-weight="700" fill="#047857">occlusion</text>
  <text x="1274" y="540" font-size="18" fill="#1f2937">遮挡恢复</text>

  <!-- 第 4 层：适配层 -->
  <rect x="40" y="618" width="1520" height="124" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <rect x="40" y="618" width="6" height="124" rx="3" fill="#f59e0b"/>
  <text x="66" y="652" font-size="20" font-weight="700" fill="#c2410c">适配层 · SDK 优先</text>

  <rect x="64" y="666" width="724" height="60" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="82" y="694" font-size="20" font-weight="700" fill="#c2410c">DroneAdapter 抽象基类</text>
  <text x="82" y="716" font-size="16" fill="#6b7280">Tello · Fake ｜ 唯一 import djitellopy</text>

  <rect x="812" y="666" width="724" height="60" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="830" y="694" font-size="20" font-weight="700" fill="#c2410c">DetectorProtocol 检测器协议</text>
  <text x="830" y="716" font-size="16" fill="#6b7280">red · aruco · person_reid</text>

  <!-- 第 5 层：横切层 -->
  <rect x="40" y="764" width="1520" height="56" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <rect x="40" y="764" width="6" height="56" rx="3" fill="#ef4444"/>
  <text x="66" y="800" font-size="20" font-weight="700" fill="#b91c1c">横切层 SafetyManager</text>
  <text x="286" y="800" font-size="18" fill="#7f1d1d">全量 RC 限速 · 电量 / 高度 / 目标丢失兜底</text>

  <!-- 层间向下箭头 -->
  <line x1="800" y1="200" x2="800" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="794,210 806,210 800,218" fill="#94a3b8"/>
  <line x1="800" y1="408" x2="800" y2="418" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="794,418 806,418 800,426" fill="#94a3b8"/>
  <line x1="800" y1="600" x2="800" y2="610" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="794,610 806,610 800,618" fill="#94a3b8"/>
  <line x1="800" y1="746" x2="800" y2="756" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="794,756 806,756 800,764" fill="#94a3b8"/>

  <!-- 页脚 -->
  <text x="40" y="834" font-size="16" fill="#9ca3af">设计目标：不是功能最多，而是任何情况下都能安全停下来。</text>
</svg>
